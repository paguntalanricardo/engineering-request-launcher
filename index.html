<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9b111e">
  <meta name="description" content="Engineering Request System - Material Request Management">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Engineering Request System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f3f4f6; color: #333;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%; max-width: 440px; background: #fff; border-radius: 16px;
      padding: 32px 24px; text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    .logo {
      width: 92px; height: 92px; object-fit: contain; margin-bottom: 16px;
    }
    h1 { margin: 0 0 8px; color: #9b111e; font-size: 23px; }
    p { color: #666; line-height: 1.5; font-size: 14px; }
    button {
      width: 100%; margin-top: 18px; border: 0; border-radius: 8px;
      padding: 15px 18px; background: #9b111e; color: #fff;
      font-size: 15px; font-weight: bold; cursor: pointer;
    }
    .hint { margin-top: 18px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./icons/icon-192.png" alt="Engineering Request System icon">
    <h1>Engineering Request System</h1>
    <p>Material Request Management<br>Beta 1.0</p>
    <button id="openApp" type="button">OPEN APPLICATION</button>
    <p class="hint">An internet connection and an authorized Google account may be required.</p>
  </main>
  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbyLXw_m3TFQXUYpK99keKuNycMN2iBL-iXawreo4_fqGTfVsSh-mUBlCHBCAwoFSBfw/exec";
    document.getElementById('openApp').addEventListener('click', () => {
      window.location.href = APP_URL;
    });
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
